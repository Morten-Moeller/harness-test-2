<form class="list-form" (ngSubmit)="submit()">
  <fieldset>
    <legend>Neue Einkaufsliste</legend>
    <div class="row">
      <div class="field">
        <label for="list-name">Name</label>
        <input
          id="list-name"
          name="name"
          type="text"
          maxlength="100"
          autocomplete="off"
          [ngModel]="listName()"
          (ngModelChange)="listName.set($event)"
        />
      </div>
      <button type="submit" [disabled]="cannotSubmit()">Anlegen</button>
    </div>
  </fieldset>
</form>

<fieldset class="layout">
  <legend>Anordnung</legend>
  <label for="layout-columns">
    <input
      id="layout-columns"
      name="layout"
      type="radio"
      value="columns"
      [checked]="layout() === 'columns'"
      (change)="layout.set('columns')"
    />
    Nebeneinander
  </label>
  <label for="layout-rows">
    <input
      id="layout-rows"
      name="layout"
      type="radio"
      value="rows"
      [checked]="layout() === 'rows'"
      (change)="layout.set('rows')"
    />
    Untereinander
  </label>
</fieldset>

@if (error(); as message) {
  <p class="error" role="alert">{{ message }}</p>
}

<div
  class="lists"
  [class.columns]="layout() === 'columns'"
  cdkDropListGroup
  cdkDropList
  cdkDropListOrientation="mixed"
  [cdkDropListData]="lists()"
  (cdkDropListDropped)="dropped($event)"
>
  @for (list of lists(); track list.id; let first = $first; let last = $last; let i = $index) {
    <app-shopping-list
      cdkDrag
      [cdkDragData]="list"
      [list]="list"
      (changed)="load()"
      (moved)="onMoved($event)"
    >
      <span listControls class="list-controls">
        <button type="button" class="handle" cdkDragHandle aria-label="Einkaufsliste ziehen">
          ⠿
        </button>
        <button
          type="button"
          class="move"
          [attr.aria-label]="'Nach oben: ' + list.name"
          [disabled]="first"
          (click)="moveList(list, i - 1)"
        >
          Nach oben
        </button>
        <button
          type="button"
          class="move"
          [attr.aria-label]="'Nach unten: ' + list.name"
          [disabled]="last"
          (click)="moveList(list, i + 1)"
        >
          Nach unten
        </button>
      </span>
    </app-shopping-list>
  } @empty {
    @if (loaded()) {
      <p class="no-lists">Noch keine Einkaufslisten.</p>
    }
  }
</div>
