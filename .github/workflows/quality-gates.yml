name: Quality gates

# One job per gate. Every job runs the project's setup action, then `make <gate>`.
# The check names `gates (test)` ... are required by harness/github/ruleset.json.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.gate }})
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [test, typecheck, lint, sast, deps]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: make ${{ matrix.gate }}
