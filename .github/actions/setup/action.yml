name: Setup
description: >-
  Toolchain for the gates of Einkaufsliste: Node from .nvmrc and pnpm for frontend/, Java 21 and
  the Maven wrapper for backend/, and the stack-neutral scanners for make sast and make deps.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: frontend/package.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install the frontend dependencies
      shell: bash
      run: pnpm --dir frontend install --frozen-lockfile

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Install semgrep
      shell: bash
      run: pipx install semgrep

    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: 8.21.2
      run: |
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin gitleaks

    - name: Install osv-scanner
      shell: bash
      env:
        OSV_VERSION: v2.0.2
      run: |
        sudo curl -sSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
        sudo chmod +x /usr/local/bin/osv-scanner
